[project]
name = "fhad-daic-au-cleaner"
version = "0.1.0"
description = "DAIC-WOZ AU feature cleaning pipeline for federated health affective detection research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]
